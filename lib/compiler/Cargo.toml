[package]
name = "wasmer-compiler"
description = "Base compiler abstraction for Wasmer WebAssembly runtime"
categories = ["wasm"]
keywords = ["wasm", "webassembly", "compiler"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
wasmer-types = { path = "../types", version = "=7.4.0", default-features = false }
wasmparser = { workspace = true, default-features = false, optional = true }
enumset.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
serde_bytes = { workspace = true, optional = true }
smallvec.workspace = true
strum = { workspace = true, optional = true }
loupe = { workspace = true, optional = true, features = [
  "indexmap",
  "enable-indexmap",
] }

backtrace.workspace = true
memmap2.workspace = true
more-asserts.workspace = true

leb128.workspace = true
enum-iterator.workspace = true

bytes.workspace = true
self_cell.workspace = true
rkyv.workspace = true
shared-buffer.workspace = true
libc.workspace = true
target-lexicon.workspace = true
object.workspace = true
addr2line.workspace = true
gimli.workspace = true
itertools.workspace = true
tempfile.workspace = true
rangemap.workspace = true
phf = { workspace = true, features = ["macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libwild.workspace = true
wasmer-vm = { path = "../vm", version = "=7.4.0" }
region.workspace = true
which.workspace = true
rayon.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
macho-unwind-info.workspace = true

[features]
default = ["std"]
# This feature is for compiler implementors, it enables using `Compiler` and
# `CompilerConfig`, as well as the included wasmparser.
# Disable this feature if you just want a headless engine.
translator = ["wasmparser"]
compiler = ["translator", "dep:strum"]
wasmer-artifact-load = []
wasmer-artifact-create = []
static-artifact-load = []
static-artifact-create = ["translator", "compiler"]
# Keep for backward compatibility.
std = []
core = []
enable-serde = ["serde", "serde_bytes", "wasmer-types/enable-serde"]
artifact-size = ["dep:loupe"]
# Signal-free trap-handler backend; see wasmer-vm's baremetal feature for details.
baremetal = ["wasmer-vm/baremetal"]

[badges]
maintenance = { status = "experimental" }

[package.metadata.docs.rs]
features = [
  "static-artifact-create",
  "static-artifact-load",
  "wasmer-artifact-create",
  "wasmer-artifact-load",
]
rustc-args = ["--cfg", "docsrs"]
