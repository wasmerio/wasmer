wasixv2-kernel = { path = "../kernel" }
wasixv2-abi = { path = "../abi" }
wasixv2-syscalls = { path = "../syscalls" }
wasixv2-vfs = { path = "../vfs" }
wasixv2-vfs-mem = { path = "../vfs-mem" }
