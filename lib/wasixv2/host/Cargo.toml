[package]
name = "wasixv2-host"
version = "0.0.0"
description = "Host services required by the WASIX kernel"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
  "io-std",
  "io-util",
  "rt",
  "sync",
  "time",
] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[features]
default = []
tokio = ["dep:tokio", "dep:getrandom"]
# A host on the JavaScript event loop, for wasm32-unknown-unknown in browsers and node.
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
