[package]
name = "wasixv2-exec"
version = "0.0.0"
description = "Runs WASIX tasks on the wasm engine"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wasixv2-abi = { path = "../abi" }
wasixv2-syscalls = { path = "../syscalls" }
wasixv2-host = { path = "../host" }
wasixv2-pages = { path = "../pages" }
wasmer = { path = "../../api", version = "=7.5.0", default-features = false, features = [
  "experimental-async",
] }
wasmer-types = { path = "../../types", version = "=7.5.0", default-features = false }
thiserror.workspace = true
tracing.workspace = true
wasm-encoder = { workspace = true, features = ["wasmparser"] }
wasmparser.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, features = ["std"] }

[dev-dependencies]
futures.workspace = true
wasmer = { path = "../../api", version = "=7.5.0", default-features = false, features = [
  "cranelift",
] }
wasmprinter.workspace = true
wat.workspace = true

[features]
default = ["sys"]
sys = ["wasmer/sys", "wasmer/headless"]
js = ["wasmer/js-default"]
