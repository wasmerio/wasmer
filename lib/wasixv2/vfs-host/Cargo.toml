[package]
name = "wasixv2-vfs-host"
version = "0.0.0"
description = "Host directory passthrough driver for the WASIX VFS"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wasixv2-vfs = { path = "../vfs" }
wasixv2-abi = { path = "../abi" }
wasixv2-host = { path = "../host" }
async-trait.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, features = ["std"] }

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
wasixv2-vfs-mem = { path = "../vfs-mem" }
wasixv2-vfs-overlay = { path = "../vfs-overlay" }
