[package]
name = "wasix-syscalls2"
description = "Wasmer host functions for the wasix2 syscall ABI"
categories = ["wasm", "os"]
keywords = ["wasm", "webassembly", "wasix", "syscalls"]
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
wasix-types2 = { path = "../wasix-types2", version = "=7.5.0" }
wasmer = { path = "../../api", version = "=7.5.0", default-features = false }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
wasmer = { path = "../../api", version = "=7.5.0", default-features = false, features = [
  "sys",
  "cranelift",
  "wat",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
wasmer = { path = "../../api", version = "=7.5.0", default-features = false, features = [
  "v8",
  "wat",
] }

[package.metadata.docs.rs]
features = ["wasmer/sys", "wasmer/cranelift"]
