[package]
name = "wasixv2"
version = "0.0.0"
description = "Embedding facade that assembles and boots a WASIX machine"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
wasixv2-abi = { workspace = true }
wasixv2-syscalls = { workspace = true }
wasixv2-trace = { workspace = true }
wasixv2-record = { workspace = true }
wasixv2-policy = { workspace = true }
wasixv2-host = { workspace = true }
wasixv2-wait = { workspace = true, optional = true }
wasixv2-vfs = { workspace = true }
wasixv2-vfs-mem = { workspace = true }
wasixv2-vfs-host = { workspace = true }
wasixv2-vfs-overlay = { workspace = true }
wasixv2-vfs-package = { workspace = true }
wasixv2-vnet = { workspace = true }
wasixv2-vnet-host = { workspace = true, optional = true }
wasixv2-vnet-switch = { workspace = true }
wasixv2-vnet-web = { workspace = true, optional = true }
wasixv2-vfs-web = { workspace = true, optional = true }
wasixv2-stdio-web = { workspace = true, optional = true }
wasixv2-kernel = { workspace = true }
wasixv2-pages = { workspace = true }
wasixv2-checkpoint = { workspace = true }
wasixv2-exec = { path = "../exec", default-features = false }
wasixv2-dylink = { path = "../dylink", default-features = false }
wasixv2-wasix1 = { path = "../wasix1", default-features = false, optional = true }
wasmer = { path = "../../api", version = "=7.5.0", default-features = false }
shared-buffer.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmparser.workspace = true
webc.workspace = true
futures-util = { workspace = true, optional = true }
async-trait.workspace = true
wasm-bindgen = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
wat.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-util.workspace = true
bincode = { workspace = true, features = ["serde"] }
virtual-net = { path = "../../virtual-net" }
wasixv2-vnet-web = { workspace = true }
wasixv2-wait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
wasmer = { path = "../../api", version = "=7.5.0", default-features = false, features = [
  "cranelift",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[features]
default = ["sys", "tokio", "host-network", "wasix1"]
sys = [
  "wasmer/sys",
  "wasmer/headless",
  "wasixv2-exec/sys",
  "wasixv2-dylink/sys",
  "wasixv2-wasix1?/sys",
]
js = [
  "wasmer/js-default",
  "wasixv2-exec/js",
  "wasixv2-dylink/js",
  "wasixv2-wasix1?/js",
]
# Runs WASIX v1 (and plain WASI preview1) programs too.
wasix1 = ["dep:wasixv2-wasix1"]
# `Machine::new` and `Stdio::inherit` on a tokio runtime.
tokio = ["wasixv2-host/tokio"]
# Guest traffic leaving the machine goes through host sockets (Unix only). Without it the
# network is loopback-only.
host-network = ["dep:wasixv2-vnet-host"]
# `WebHost`, for embedders on a JavaScript event loop; pair with `js` on wasm32.
web = ["wasixv2-host/web"]
# Full shared-runtime worker profile. Disable defaults when targeting the browser.
browser-drivers = [
  "dep:wasixv2-vnet-web",
  "dep:wasixv2-vfs-web",
  "dep:wasixv2-stdio-web",
]
browser = [
  "js",
  "web",
  "wasixv2-host/browser",
  "browser-drivers",
  "dep:wasixv2-wait",
  "dep:futures-util",
  "dep:wasm-bindgen",
]

[[example]]
name = "browser-facade"
crate-type = ["cdylib"]
required-features = ["browser", "wasix1"]
