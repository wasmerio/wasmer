[package]
name = "wasix-tests"
version = "0.0.0"
description = "WASIX guest-side test suite, run against WASIX v1 and WASIX v2"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[test]]
name = "wasm_tests"
path = "tests/wasm_tests/mod.rs"
harness = false

[dev-dependencies]
wasmer-wasix.workspace = true
wasmer = { path = "../api", version = "=7.5.0", default-features = false }
wasmer-types = { path = "../types", version = "=7.5.0", default-features = false }
anyhow.workspace = true
dirs.workspace = true
itertools.workspace = true
libtest-mimic.workspace = true
strum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
version-compare.workspace = true
walkdir.workspace = true

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
wasmer = { path = "../api", version = "=7.5.0", default-features = false, features = [
  "cranelift",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
wasmer = { path = "../api", version = "=7.5.0", default-features = false, features = [
  "v8",
] }

[features]
llvm = ["wasmer/llvm", "wasmer-wasix/llvm"]
singlepass = ["wasmer/singlepass", "wasmer-wasix/singlepass"]
v8 = ["wasmer/v8", "wasmer-wasix/v8"]
