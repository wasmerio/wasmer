name: WASIX v2 browser
on:
  pull_request:
    paths:
      - "lib/wasixv2/**"
      - "lib/api/**"
      - "tests/wasixv2"
      - ".github/workflows/wasixv2-browser.yaml"
  push:
    branches: [feat/wasixv2, wasixv2/b8-facade, wasixv2/b17-ci]
  workflow_dispatch:
env:
  WASIX_BROWSER_CPUS: 0-3
permissions:
  contents: read
  actions: read
jobs:
  adapter:
    name: Browser adapter (SAB, isolated, no JSPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/wasixv2/browser/package-lock.json
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
      - name: Check native exporter tooling (unit tests only)
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_BUILD_JOBS: "3"
          RUST_TEST_THREADS: "3"
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/browser-adapter
        shell: bash
        run: |
          git -C tests/wasixv2 submodule update --init upstream/ltp
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" cargo test --manifest-path tests/wasixv2/Cargo.toml -p wasixv2-tests --locked -j3
          export RUSTFLAGS="$(sed -n 's/^lint-packages: RUSTFLAGS += \(.*\) # TODO:.*/\1/p' Makefile)"
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" cargo clippy --manifest-path tests/wasixv2/Cargo.toml -p wasixv2-tests --all-targets --locked -j3 -- -D clippy::all
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" cargo fmt --manifest-path tests/wasixv2/Cargo.toml --all --check
      - name: Install pinned browser tooling
        working-directory: tests/wasixv2/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check adapter and failure paths in real Chromium
        working-directory: tests/wasixv2/browser
        env:
          BROWSER_TEST_ARTIFACTS: artifacts/regressions
        run: |
          mkdir -p artifacts
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" npm test > artifacts/regressions.log 2>&1
      - name: Source-built transport smoke (infrastructure only)
        working-directory: tests/wasixv2/browser
        run: nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" node run.mjs --smoke --artifacts artifacts/transport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasixv2-browser-adapter-results
          path: tests/wasixv2/browser/artifacts
          if-no-files-found: error
  runtime:
    name: B2 threaded debug smoke (SAB, isolated, no JSPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/browser-runtime
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install B2's pinned nightly and matching bindgen CLI
        shell: bash
        run: |
          test -f lib/wasixv2/host/tests/browser/build.sh
          rustup toolchain install nightly-2026-08-08 --profile minimal --component rust-src --target wasm32-unknown-unknown
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/version = "\(.*\)"/\1/p;}' Cargo.lock)
          curl --fail --location --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/bindgen.tar.gz"
          tar -xzf "$RUNNER_TEMP/bindgen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-${version}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasixv2-browser-runtime
          cache-targets: "false"
      - name: Link and inspect B2's debug runtime artifact
        run: bash lib/wasixv2/host/tests/browser/build.sh > browser-build.log 2>&1
      - name: Reuse B2 smoke through Playwright
        working-directory: tests/wasixv2/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" node run.mjs --smoke --b2-smoke --runtime "$CARGO_TARGET_DIR/browser" --artifacts artifacts/b2
      - name: Link the browser facade and run lifecycle regressions
        run: |
          python3 lib/wasixv2/api/tests/browser/check-features.py > browser-features.log
          bash lib/wasixv2/api/tests/browser/build.sh >> browser-build.log 2>&1
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" node --test lib/wasixv2/api/tests/browser/*.test.mjs
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" node lib/wasixv2/api/tests/browser/lifecycle.mjs "$CARGO_TARGET_DIR/browser" > browser-lifecycle.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasixv2-browser-runtime-results
          path: |
            browser-build.log
            browser-lifecycle.log
            browser-features.log
            tests/wasixv2/browser/artifacts
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wasixv2-browser-runtime
          path: target/browser-runtime/browser
          if-no-files-found: error
  fixture-export:
    name: Build reviewed WASIX fixtures from pinned sources
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      WASIXV2_BROWSER_TOOLS: ${{ github.workspace }}/target/browser-tools
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/browser-export
      # github.token and COMPAT_TESTS_GH_TOKEN cannot read private libc2.
      GH_TOKEN: ${{ secrets.WASIXV2_TOOLCHAIN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/load_toolchain
        id: load_toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.load_toolchain.outputs.rust_toolchain }}
      - name: Install native source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld build-essential python3 curl git gh rsync
      - uses: actions/cache/restore@v4
        id: tools-cache
        with:
          # Cache executables, resource headers and sysroots, not private sources
          # or multi-GB LLVM object files. Paths match the producer's env.sh.
          path: |
            ${{ env.WASIXV2_BROWSER_TOOLS }}/bin
            ${{ env.WASIXV2_BROWSER_TOOLS }}/build/llvm/bin
            ${{ env.WASIXV2_BROWSER_TOOLS }}/build/llvm/lib/clang
            ${{ env.WASIXV2_BROWSER_TOOLS }}/build/binaryen/bin
            ${{ env.WASIXV2_BROWSER_TOOLS }}/sysroots/sysroot-wasixv2
            ${{ env.WASIXV2_BROWSER_TOOLS }}/sysroots/sysroot-wasixv2-asyncify
            ${{ env.WASIXV2_BROWSER_TOOLS }}/complete-*
          key: wasixv2-browser-tools-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/wasixv2/api/tests/browser/toolchain.env', 'lib/wasixv2/api/tests/browser/prepare-toolchain.sh') }}
      - name: Build pinned v2 compiler and EH/asyncify C sysroots
        run: |
          bash lib/wasixv2/api/tests/browser/prepare-toolchain.sh > browser-toolchain.log 2>&1 || {
            tail -n 80 browser-toolchain.log
            exit 1
          }
      - uses: actions/cache/save@v4
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ env.WASIXV2_BROWSER_TOOLS }}/bin
            ${{ env.WASIXV2_BROWSER_TOOLS }}/build/llvm/bin
            ${{ env.WASIXV2_BROWSER_TOOLS }}/build/llvm/lib/clang
            ${{ env.WASIXV2_BROWSER_TOOLS }}/build/binaryen/bin
            ${{ env.WASIXV2_BROWSER_TOOLS }}/sysroots/sysroot-wasixv2
            ${{ env.WASIXV2_BROWSER_TOOLS }}/sysroots/sysroot-wasixv2-asyncify
            ${{ env.WASIXV2_BROWSER_TOOLS }}/complete-*
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Export only the reviewed browser subset
        run: |
          source "$WASIXV2_BROWSER_TOOLS/env.sh"
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" cargo run --manifest-path tests/wasixv2/Cargo.toml -p wasixv2-tests --locked -j3 -- --browser-export "$RUNNER_TEMP/browser-fixtures" > browser-export.log 2>&1
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" cargo run --manifest-path tests/wasixv2/Cargo.toml -p wasixv2-tests --locked -j3 -- --browser-v1-export "$RUNNER_TEMP/browser-v1-fixtures" > browser-v1-export.log 2>&1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wasixv2-browser-fixtures
          path: ${{ runner.temp }}/browser-fixtures
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasixv2-browser-v1-fixtures
          path: ${{ runner.temp }}/browser-v1-fixtures
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasixv2-browser-toolchain-results
          path: |
            browser-toolchain.log
            browser-export.log
            browser-v1-export.log
          if-no-files-found: warn
  fixtures:
    name: Reviewed browser fixtures (SAB, isolated, no JSPI)
    needs: [runtime, fixture-export]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: wasixv2-browser-fixtures
          path: browser-fixtures
      - uses: actions/download-artifact@v4
        with:
          name: wasixv2-browser-runtime
          path: browser-runtime
      - uses: actions/download-artifact@v4
        with:
          name: wasixv2-browser-v1-fixtures
          path: browser-v1-fixtures
      - name: Run every selected configuration
        working-directory: tests/wasixv2/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" node run.mjs --manifest "$GITHUB_WORKSPACE/browser-fixtures/manifest.json" --runtime "$GITHUB_WORKSPACE/browser-runtime" --artifacts artifacts/fixtures
          nice -n 19 taskset -c "$WASIX_BROWSER_CPUS" node run.mjs --manifest "$GITHUB_WORKSPACE/browser-v1-fixtures/manifest.json" --runtime "$GITHUB_WORKSPACE/browser-runtime" --artifacts artifacts/v1-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasixv2-browser-fixture-results
          path: tests/wasixv2/browser/artifacts
          if-no-files-found: error
