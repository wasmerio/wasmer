name: Native x86-64 V8 guest import CPU profile
on:
  push:
    branches:
      - codex/x64-v8-guest-import-profile-7195
permissions:
  contents: read
jobs:
  profile:
    runs-on: aux-pub-16cpu-amd64
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.0.0
      - name: Sample guest-driven Wasm-to-JS imports and guest-only control
        shell: bash
        working-directory: benches/x64_v8_guest_import_profile
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(node -p process.arch)" = x64
          export STUDY_OUT="$RUNNER_TEMP/v8-x86-import-profile"
          mkdir -p "$STUDY_OUT"
          cpu=$(python3 select_cpu.py "$STUDY_OUT")
          uname -a > "$STUDY_OUT/uname.txt"
          lscpu > "$STUDY_OUT/lscpu.txt"
          node -p 'JSON.stringify(process.versions, null, 2)' > "$STUDY_OUT/node-versions.json"
          sha256sum import.wasm loop.wasm > "$STUDY_OUT/modules.txt"
          taskset -c "$cpu" bash profile.sh > "$STUDY_OUT/driver.log" 2>&1 || { tail -c 1600 "$STUDY_OUT/driver.log"; exit 1; }
      - name: Upload CPU profiles, process maps and timing controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-x86-64-guest-import-profile
          path: ${{ runner.temp }}/v8-x86-import-profile
          retention-days: 14
