name: Native x86-64 coroutine benchmark
on:
  push:
    branches:
      - codex/x64-coroutine-study-7195
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: aux-pub-16cpu-amd64
    timeout-minutes: 100
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
          persist-credentials: false
      - name: Verify source revisions and record the runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          git fetch --no-tags --depth=1 origin cd3f199b2b78b5050741ba25a5dec7f87f82829f 2fbbdd36e7fafe4aba6d710dd6a0dccc65128cc4
          test "$(git rev-parse '2fbbdd36e7f^{commit}')" = 2fbbdd36e7fafe4aba6d710dd6a0dccc65128cc4
          test "$(git rev-parse 'cd3f199b2b7^{commit}')" = cd3f199b2b78b5050741ba25a5dec7f87f82829f
          mkdir -p "$RUNNER_TEMP/wasmer-x86-results"
          {
            uname -a
            lscpu
            cat /proc/self/cgroup
            cat /sys/fs/cgroup/cpu.max || true
            taskset -pc $$
            df -h .
            free -h
          } | tee "$RUNNER_TEMP/wasmer-x86-results/runner.txt"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Install the repository's Linux x86-64 LLVM 23 toolchain
        shell: bash
        run: |
          set -euo pipefail
          llvm="$RUNNER_TEMP/llvm-23"
          archive="$RUNNER_TEMP/llvm-23.tar.zst"
          mkdir -p "$llvm"
          curl --retry 3 --proto '=https' --tlsv1.2 -fsSL https://github.com/wasmerio/llvm-custom-builds/releases/download/23.x/llvm-linux-amd64.tar.zst -o "$archive"
          echo "18a4e32917af2cbbc7189e417febeada746f62cd1c8473c26bae80bf46fad203  $archive" | sha256sum --check
          tar --zstd --strip-components=1 -xf "$archive" -C "$llvm"
          rm "$archive"
          echo "LLVM_SYS_231_PREFIX=$llvm" >> "$GITHUB_ENV"
          echo "$llvm/bin" >> "$GITHUB_PATH"
          "$llvm/bin/llvm-config" --version
      - name: Build both revisions and Wasmtime
        shell: bash
        run: python3 benches/x64_study/run.py --repo "$PWD" --output "$RUNNER_TEMP/wasmer-x86-results" --build-only
      - name: Measure direct and reentrant calls on one native CPU
        shell: bash
        run: |
          set -euo pipefail
          python3 benches/x64_study/run.py --repo "$PWD" --output "$RUNNER_TEMP/wasmer-x86-results" --measure-only
      - name: Run LLVM traps, reentry and async suspension checks
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/wasmer-x86-results"
          cargo test --locked -p wasmer --no-default-features --features 'sys,wat,llvm,experimental-async,experimental-host-interrupt' --test async_activation --test interrupt_async --test call_wrapper --test current_store --test dynamic_function_results --test numeric_values -- --test-threads=1 2>&1 | tee "$results/llvm-api.log"
          cargo test --locked -p wasmer-vm --lib 2>&1 | tee "$results/vm.log"
      - name: Measure native V8 C API calls
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          v8="$RUNNER_TEMP/v8"
          results="$RUNNER_TEMP/wasmer-x86-results"
          mkdir "$v8"
          curl --retry 3 --proto '=https' --tlsv1.2 -fsSL https://github.com/wasmerio/v8-custom-builds/releases/download/15.9.111.0/v8-linux-amd64.tar.xz -o "$v8/v8.tar.xz"
          echo "4a3b440b0886aad6050ed46cd2679e3ea9ef3533476a60583bba838b87ff892e  $v8/v8.tar.xz" | sha256sum --check
          tar -xJf "$v8/v8.tar.xz" -C "$v8"
          header=$(find "$v8" -name wasm.h -print -quit)
          lib=$(find "$v8" -name libv8.a -print -quit)
          test -f "$lib" && test -f "$header"
          g++ -O3 -std=c++17 -I"$(dirname "$header")" benches/x64_study/native_calls.cc "$lib" -pthread -ldl -o "$v8/native_calls"
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" "$v8/native_calls" | tee "$results/v8-native.csv"
      - name: Upload samples, summaries and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasmer-x86-64-coroutine-study
          path: ${{ runner.temp }}/wasmer-x86-results
          retention-days: 14
